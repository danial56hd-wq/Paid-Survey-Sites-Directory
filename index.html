<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل مواقع الاستبيانات المدفوعة</title>
<link rel="manifest" id="manifestLink">
<style>
  :root{
    --bg:#0F1A17; --panel:#16241F; --panel2:#1D2E27; --line:#2A3D34;
    --gold:#C9A227; --gold-soft:#8B7A2E; --kiwi:#8FCB2E;
    --text:#EDEBDF; --text-dim:#9FB0A6; --ok:#4E9F5D; --warn:#D98B3A; --bad:#C1503F;
  }
  *{box-sizing:border-box; max-width:100%;}
  html,body{margin:0; padding:0; width:100%; overflow-x:hidden; overscroll-behavior-x:none;}
  body{background:var(--bg); color:var(--text); font-family:"Tahoma","Segoe UI",Arial,sans-serif; line-height:1.6; position:relative; overflow-x:hidden; touch-action:pan-y; -ms-touch-action:pan-y;}
  header, main, footer, .controls{ max-width:100vw; }
  .glow-orb{ position:absolute; top:-120px; inset-inline-end:-80px; width:340px; height:340px;
    background:radial-gradient(circle, rgba(201,162,39,0.16) 0%, rgba(201,162,39,0) 70%);
    filter:blur(10px); animation:drift 14s ease-in-out infinite alternate; pointer-events:none; z-index:0;}
  @keyframes drift{ from{transform:translate(0,0) scale(1);} to{transform:translate(-30px,40px) scale(1.15);} }
  header{ position:relative; z-index:1; padding:20px 20px 18px; border-bottom:1px solid var(--line); }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .live{ display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; letter-spacing:0.5px; color:var(--kiwi); font-weight:bold; }
  .live-dot{ width:10px; height:10px; border-radius:50%; background:var(--kiwi); opacity:0.85; animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(143,203,46,0.55);} 70%{box-shadow:0 0 0 9px rgba(143,203,46,0);} 100%{box-shadow:0 0 0 0 rgba(143,203,46,0);} }
  .dev-credit{ font-style:italic; font-size:0.82rem; font-weight:600; color:#EAD98C; animation:softglow 3s ease-in-out infinite; }
  @keyframes softglow{ 0%,100%{text-shadow:0 0 2px rgba(234,217,140,0.25);} 50%{text-shadow:0 0 8px rgba(234,217,140,0.55);} }
  .top-actions{ display:flex; gap:8px; align-items:center; }
  select#langSelect{ background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:16px; padding:6px 10px; font-size:0.78rem; }
  .icon-btn{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--panel2); border:1px solid var(--line); border-radius:50%; cursor:pointer; color:var(--text); text-decoration:none; }
  .icon-btn:hover{ border-color:var(--gold-soft); }
  .icon-btn svg{ width:16px; height:16px; }
  header h1{ margin:4px 0 6px; font-size:1.45rem; color:var(--gold); }
  header p{ margin:0; color:var(--text-dim); font-size:0.92rem; max-width:640px; }
  .controls{ display:flex; flex-wrap:wrap; gap:10px; padding:16px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .controls input, .controls select{ background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:6px; font-size:0.9rem; flex:1 1 160px; }
  main{ position:relative; z-index:1; padding:16px 20px 40px; }
  .section-title{ font-size:1.05rem; color:var(--text); margin:26px 0 12px; border-inline-start:3px solid var(--gold); padding-inline-start:10px; }
  .section-desc{ color:var(--text-dim); font-size:0.87rem; }
  .count{ color:var(--text-dim); font-size:0.85rem; margin:0 0 12px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; transition:border-color .25s ease, transform .25s ease; }
  .card:hover{ border-color:var(--gold-soft); transform:translateY(-1px); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .card-top h3{ margin:0; font-size:1.05rem; }
  .card-top a{ color:var(--gold); text-decoration:none; font-size:0.85rem; border:1px solid var(--gold-soft); padding:6px 12px; border-radius:20px; white-space:nowrap; }
  .card-top a:hover{ background:var(--gold); color:#12241C; }
  .badge{ display:inline-block; font-size:0.75rem; padding:3px 9px; border-radius:20px; margin:8px 6px 0 0; }
  .b-open{ background:rgba(78,159,93,0.18); color:var(--ok); }
  .b-vpn{ background:rgba(217,139,58,0.18); color:var(--warn); }
  .b-closed{ background:rgba(193,80,63,0.18); color:var(--bad); }
  .meta{ margin-top:10px; font-size:0.87rem; color:var(--text-dim); }
  .meta b{ color:var(--text); }
  footer{ position:relative; z-index:1; padding:20px; border-top:1px solid var(--line); color:var(--text-dim); font-size:0.83rem; }
  footer h4{ color:var(--text); margin:0 0 6px; }
  footer .note{ background:var(--panel2); border-inline-start:3px solid var(--bad); padding:12px 14px; border-radius:6px; margin:10px 0; }
  .contact-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .contact-row a{ display:inline-flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line); padding:8px 14px; border-radius:20px; color:var(--text); text-decoration:none; font-size:0.82rem; }
  .contact-row a:hover{ border-color:var(--gold-soft); }
  .contact-row svg{ width:15px; height:15px; }
  .fab-stack{ position:fixed; bottom:18px; inset-inline-end:18px; display:flex; flex-direction:column; gap:10px; z-index:40; }
  .fab{ width:52px; height:52px; border-radius:50%; background:var(--gold); color:#12241C; border:none; font-size:1.3rem; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.4); }
  .fab.secondary{ background:var(--panel2); color:var(--text); border:1px solid var(--line); width:44px; height:44px; font-size:1.05rem; }
  .sheet, .chatbox{ position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:16px 18px 22px; z-index:50; transform:translateY(100%); transition:transform .3s ease; max-height:70vh; overflow-y:auto; }

  .sheet h4, .chatbox h4{ margin:0 0 12px; color:var(--gold); }
  .sheet a{ display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--line); padding:10px 14px; border-radius:8px; color:var(--text); text-decoration:none; margin-bottom:8px; font-size:0.88rem; }
  .close-x{ position:absolute; top:12px; inset-inline-start:16px; background:none; border:none; color:var(--text-dim); font-size:1.1rem; cursor:pointer; }
  .chat-log{ min-height:120px; max-height:38vh; overflow-y:auto; margin-bottom:10px; }
  .chat-bubble{ background:var(--panel2); border:1px solid var(--line); padding:9px 12px; border-radius:10px; margin-bottom:8px; font-size:0.87rem; max-width:90%; }
  .chat-bubble.user{ margin-inline-start:auto; border-color:var(--gold-soft); }
  .chat-input-row{ display:flex; gap:8px; }

  .chat-hint{ font-size:0.76rem; color:var(--text-dim); margin-top:8px; }
</style>
</head>

</div>

<div class="chatbox" id="chatBox">

/* ============ badges / cards ============ */
function statusBadge(s){
  const t = I18N[currentLang];
  if(s==="open") return `<span class="badge b-open">${t.statusOpen}</span>`;
  if(s==="vpn") return `<span class="badge b-vpn">${t.statusVpn}</span>`;
  return `<span class="badge b-closed">${t.statusClosed}</span>`;
}
function noteFor(site){ return site.note[currentLang] || site.note.en || site.note.ar; }
function payLabels(site){ const t = I18N[currentLang]; return site.pay.map(k => t.pay[k] || k).join('، '); }

function cardHTML(s){
  const t = I18N[currentLang];
  return `
    <div class="card">
      <div class="card-top">
        <h3>${s.name}</h3>
        <a href="${s.url}" target="_blank" rel="noopener">${t.openSite}</a>
      </div>
      ${statusBadge(s.status)}
      <div class="meta"><b>${t.payLabel}</b> ${payLabels(s)}</div>
      <div class="meta">${noteFor(s)}</div>
    </div>`;
}

function populateFilterOptions(){
  const t = I18N[currentLang];
  const fp = document.getElementById('filterPay');
  const fs = document.getElementById('filterStatus');
  fp.innerHTML = `<option value="">${t.payAll}</option>` +
    Object.keys(t.pay).map(k=>`<option value="${k}">${t.pay[k]}</option>`).join('');
  fs.innerHTML = `<option value="">${t.statusAll}</option>
    <option value="open">${t.statusOpen}</option>
    <option value="vpn">${t.statusVpn}</option>
    <option value="closed">${t.statusClosed}</option>`;
}

function render(){
  const t = I18N[currentLang];
  const q = document.getElementById('search').value.trim().toLowerCase();
  const pay = document.getElementById('filterPay').value;
  const status = document.getElementById('filterStatus').value;

  const filtered = sites.filter(s=>{
    if(q && !s.name.toLowerCase().includes(q)) return false;
    if(pay && !s.pay.includes(pay)) return false;
    if(status && s.status !== status) return false;
    return true;
  });

  document.getElementById('count').textContent = t.countT(filtered.length, sites.length);
  document.getElementById('list').innerHTML = filtered.map(cardHTML).join('');
  document.getElementById('extraList').innerHTML = extras.map(cardHTML).join('');
}

  currentLang = lang;
  const t = I18N[lang];

/* ============ sheets ============ */
function openSheet(id){ document.getElementById(id).classList.add('open'); }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn=> btn.addEventListener('click', ()=> closeSheet(btn.getAttribute('data-close'))));

/* ============ share ============ */
function doShare(){
  const t = I18N[currentLang];
  const shareData = { title: t.title, text: t.title + ' — by nidal watfa', url: location.href };
  if(navigator.share){ navigator.share(shareData).catch(()=>{}); }
  else{ openSheet('shareSheet'); }
}
document.getElementById('shareTopBtn').addEventListener('click', doShare);
document.getElementById('shareWhatsapp').addEventListener('click', function(e){
  e.preventDefault();
  window.open('https://wa.me/?text=' + encodeURIComponent(I18N[currentLang].title + ': ' + location.href), '_blank');
});
document.getElementById('shareTelegram').addEventListener('click', function(e){
  e.preventDefault();
  window.open('https://t.me/share/url?url=' + encodeURIComponent(location.href) + '&text=' + encodeURIComponent(I18N[currentLang].title), '_blank');
});
document.getElementById('shareCopy').addEventListener('click', function(e){
  e.preventDefault();
  navigator.clipboard?.writeText(location.href).then(()=>{
    const t = I18N[currentLang];
    this.textContent = t.copied;
    setTimeout(()=> this.textContent = t.shareCopy, 1800);
  });
});

/* ============ install / PWA ============ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('doInstall').style.display = 'inline-block';
  document.getElementById('installMsg').textContent = I18N[currentLang].installReady;
});
document.getElementById('installFab').addEventListener('click', ()=> openSheet('installSheet'));
document.getElementById('doInstall').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

function findAnswer(msg){
  const t = I18N[currentLang];
  const lower = msg.toLowerCase();
  const site = sites.concat(extras).find(s=> lower.includes(s.name.toLowerCase()));
  if(site){
    return `${site.name}: ${t.payLabel} ${payLabels(site)} — ${site.status==='open'?t.statusOpen:site.status==='vpn'?t.statusVpn:t.statusClosed}. ${noteFor(site)}`;
  }
  const list = FAQS[currentLang] || FAQS.en;
  const hit = list.find(f=> f.k.some(k=> lower.includes(k)));
  if(hit) return hit.a;
  return t.chatNotFound;
}

function addBubble(text, who){
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'chat-bubble' + (who==='user' ? ' user' : '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
document.getElementById('chatFab').addEventListener('click', ()=>{
  openSheet('chatBox');
  if(!document.getElementById('chatLog').children.length){
    addBubble(I18N[currentLang].chatGreeting, 'bot');
  }
});
function sendChat(){
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  if(!val) return;
  addBubble(val, 'user');
  input.value = '';
  setTimeout(()=> addBubble(findAnswer(val), 'bot'), 300);
}
document.getElementById('chatSend').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
